<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="Okeyix">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="okeyix">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Okeyix</title>
  <style>
    @font-face { font-family: Montserrat; src: url('assets/assets/fonts/Montserrat-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    html, body { margin: 0; width: 100%; height: 100%; background: #081b15; }
    #splash {
      position: fixed; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box;
      padding: max(12px, env(safe-area-inset-top)) max(5.5vw, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) 20px;
      background: linear-gradient(90deg, transparent 35%, #08110dcc), url('splash/img/light-background.png') center / cover;
      color: #e7d9bc; font-family: Montserrat, sans-serif;
    }
    .startup-content { width: 44%; max-width: 580px; }
    .startup-logo { display: block; width: 86%; max-height: 25vh; object-fit: contain; margin: 0 auto 8px; }
    .startup-motto { text-align: center; font-size: clamp(10px, 1.55vw, 15px); margin: 0; color: #e7cfa4; }
    .startup-track {
      height: 10px; box-sizing: border-box; padding: 2px; overflow: hidden;
      border: 1px solid #ae9060aa; border-radius: 20px; background: #081a13cc;
      margin-top: clamp(24px, 8vh, 38px); box-shadow: 0 0 12px #0006;
    }
    .startup-fill { height: 100%; width: 35%; border-radius: inherit; background: linear-gradient(90deg, #a97834, #e6c47f, #ffe9b6); animation: loading 1.8s ease-in-out infinite; }
    .startup-status { margin: 12px 0 0; font-size: clamp(10px, 1.4vw, 13px); line-height: 1.4; }
    @keyframes loading { from { transform: translateX(-110%); } to { transform: translateX(390%); } }
    @media (prefers-reduced-motion: reduce) { .startup-fill { animation: none; width: 100%; opacity: .65; } }
  </style>
  <script>
    function removeSplashFromWeb() { document.getElementById('splash')?.remove(); }
    window.addEventListener('flutter-first-frame', removeSplashFromWeb, { once: true });
  </script>
</head>
<body>
  <div id="splash" role="status" aria-label="Okeyix y&#252;kleniyor">
    <div class="startup-content">
      <img class="startup-logo" src="splash/img/okeyix-logo.png" alt="Okeyix">
      <p class="startup-motto">Adil Da&#287;&#305;t&#305;m &middot; Ger&#231;ek Rekabet</p>
      <div class="startup-track" role="progressbar" aria-label="Oyun y&#252;kleniyor"><div class="startup-fill"></div></div>
      <p class="startup-status">Oyun y&#252;kleniyor&#8230;</p>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
