
[functions.delete-voice]
enabled = true
verify_jwt = true
import_map = "./functions/delete-voice/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-voice/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-voice/*.html" ]

[functions.process_reengagement_notifications]
enabled = true
# Server-only endpoint. index.ts validates a dedicated 32+ character secret.
# It accepts neither public API keys nor end-user JWTs as authorization.
verify_jwt = false

[functions.send_reengagement_test]
enabled = true
# Independent manual test secret + server-pinned user/device + one-use SQL ticket.
verify_jwt = false
[functions.pisti]
verify_jwt = false

[functions.send_table_invite_push]
verify_jwt = true
